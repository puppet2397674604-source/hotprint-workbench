<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>印选 · HotPrint 印花热点选品看板</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
  <div class="app-shell" id="app-shell">
    <!-- Mobile backdrop for sidebar drawer -->
    <div class="sidebar-backdrop" id="sidebar-backdrop" aria-hidden="true"></div>

    <!-- Lightweight Left Pipeline Navigation -->
    <aside class="sidebar" id="sidebar" aria-label="主工作台导航">
      <div class="brand-block">
        <div class="brand-mark" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
            <defs>
              <linearGradient id="hpBrandGrad" x1="0" y1="0" x2="26" y2="26" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#3B6BF6"/>
                <stop offset="100%" stop-color="#6366F1"/>
              </linearGradient>
            </defs>
            <rect width="26" height="26" rx="8" fill="url(#hpBrandGrad)"/>
            <path d="M7.5 18.5V7.5H13.4C15.8 7.5 17.6 9.3 17.6 11.7C17.6 14.1 15.8 15.9 13.4 15.9H10.5V18.5H7.5Z" fill="#FFFFFF"/>
            <circle cx="18.2" cy="18.1" r="2.5" fill="#F472B6"/>
          </svg>
        </div>
        <div class="brand-copy">
          <div class="brand-name">印选 HotPrint</div>
          <div class="brand-sub">Pattern Analytics · v0.1.2</div>
        </div>
        <button class="icon-btn sidebar-close" id="sidebar-close" type="button" aria-label="收起导航菜单">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M5 5l10 10M15 5L5 15" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <nav class="nav-sections" id="nav-sections">
        <div class="nav-group">
          <div class="nav-group-label">工作台</div>
          <button class="nav-item" type="button" data-route="collection">
            <span class="nav-step">01</span>
            <span class="nav-text">
              <span class="nav-title">数据采集</span>
            </span>
          </button>
          <button class="nav-item" type="button" data-route="preprocessing">
            <span class="nav-step">02</span>
            <span class="nav-text">
              <span class="nav-title">数据预处理</span>
            </span>
          </button>
          <button class="nav-item is-active" type="button" data-route="dashboard" aria-current="page">
            <span class="nav-step">03</span>
            <span class="nav-text">
              <span class="nav-title">市场看板</span>
            </span>
          </button>
          <button class="nav-item" type="button" data-route="scoring">
            <span class="nav-step">04</span>
            <span class="nav-text">
              <span class="nav-title">候选评分</span>
            </span>
          </button>
          <button class="nav-item" type="button" data-route="print_verification">
            <span class="nav-step">05</span>
            <span class="nav-text">
              <span class="nav-title">印花归组</span>
            </span>
          </button>
          <button class="nav-item" type="button" data-route="top10_directions">
            <span class="nav-step">06</span>
            <span class="nav-text">
              <span class="nav-title">Top 10 方向</span>
            </span>
          </button>
        </div>
      </nav>

      <div class="sidebar-footer" id="sidebar-footer">
        <div class="db-status-card" id="db-status-card">
          <div class="db-status-head">
            <span class="status-dot" id="db-status-dot"></span>
            <span class="db-status-label" id="db-status-label">检查数据源…</span>
          </div>
          <div class="db-status-meta" id="db-status-meta">只读本地快照</div>
          <div class="safety-tag" id="safety-tag">安全模式 · 禁止付费请求</div>
        </div>
      </div>
    </aside>

    <!-- Main Workspace -->
    <div class="workspace">
      <header class="topbar" id="topbar">
        <div class="topbar-left">
          <button class="icon-btn menu-toggle" id="menu-toggle" type="button" aria-label="打开导航菜单">
            <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M3 5h14M3 10h14M3 15h14" stroke-linecap="round"/>
            </svg>
          </button>
          <div class="page-heading">
            <h1 class="page-title" id="page-title">市场分析看板</h1>
          </div>
        </div>

        <div class="topbar-controls" id="topbar-controls">
          <div class="scope-group" id="scope-controls">
            <label class="date-select-wrap" aria-label="观察日期">
              <select id="date-select" class="select-compact"></select>
            </label>
            <div class="segmented" id="category-switch" role="tablist" aria-label="类目范围切换">
              <button type="button" class="seg-btn is-active" data-category="all" role="tab" aria-selected="true">全部</button>
            </div>
          </div>
          <div class="action-group">
            <button type="button" class="icon-btn btn-refresh-icon" id="btn-refresh" title="刷新数据" aria-label="刷新数据">
              <svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M16.5 10a6.5 6.5 0 1 1-1.9-4.6L16.5 7.3"/>
                <path d="M16.5 3.5v3.8h-3.8"/>
              </svg>
            </button>
          </div>
        </div>
      </header>

      <!-- Dynamic Stage Container -->
      <main class="main-content" id="main-content" tabindex="-1">
        <div class="loading-state">
          <div class="spinner" aria-hidden="true"></div>
          <p>正在加载数据…</p>
        </div>
      </main>
    </div>
  </div>

  <!-- Product Evidence Slide-over Drawer -->
  <div class="drawer-overlay" id="drawer-overlay" aria-hidden="true"></div>
  <aside class="detail-drawer" id="detail-drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" aria-hidden="true">
    <div class="drawer-header">
      <div>
        <div class="drawer-eyebrow" id="drawer-eyebrow">PRODUCT DETAIL</div>
        <h2 class="drawer-title" id="drawer-title">商品详情</h2>
      </div>
      <button type="button" class="icon-btn" id="drawer-close" aria-label="关闭详情抽屉">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M5 5l10 10M15 5L5 15" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <!-- Human Review Confirm Modal -->
  <div class="modal-overlay" id="review-modal-overlay" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="review-modal-title">
      <div class="modal-header">
        <div>
          <div class="drawer-eyebrow" id="review-modal-eyebrow">MANUAL VERIFICATION</div>
          <h2 class="modal-title" id="review-modal-title">人工审核确认</h2>
        </div>
        <button type="button" class="icon-btn" id="review-modal-close" aria-label="关闭审核确认弹窗">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M5 5l10 10M15 5L5 15" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <div class="modal-body" id="review-modal-body"></div>
    </div>
  </div>

  <!-- Floating Chart Tooltip -->
  <div class="chart-tooltip" id="chart-tooltip" role="tooltip" aria-hidden="true"></div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
